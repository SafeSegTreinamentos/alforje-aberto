name: Publicar post do dia

on:
  schedule:
    # 11h07 em Brasília; os horários seguintes são reserva caso o GitHub atrase/pule
    - cron: "7 14 * * *"
    - cron: "37 15 * * *"
    - cron: "17 17 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Só montar as imagens, sem publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Configurar git
        run: |
          git config user.name "alforje-aberto-bot"
          git config user.email "alforje-aberto-bot@users.noreply.github.com"
      - name: Montar e publicar
        env:
          IG_USER_TOKEN: ${{ secrets.IG_USER_TOKEN }}
          DRY_RUN: ${{ inputs.teste && '1' || '0' }}
        run: python scripts/publish.py
